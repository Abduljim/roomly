services:
  db:
    image: postgres:16-alpine
    container_name: roomly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: roomly
      POSTGRES_PASSWORD: roomly
      POSTGRES_DB: roomly
    ports:
      - "5432:5432"
    volumes:
      - roomly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomly -d roomly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roomly_pgdata: