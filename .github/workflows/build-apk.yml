name: Build Android APK

# Builds a signed, installable APK from the Capacitor Android project.
# - Works WITHOUT Android Studio (cloud runner has the SDK + JDK).
# - Artifact can be downloaded and installed directly on an Android phone.
#
# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   ROOMLY_KEYSTORE_PASSWORD - password of the keystore
#   ROOMLY_KEY_PASSWORD      - password of the key inside the keystore
#   ROOMLY_KEY_ALIAS         - alias of the key (default "roomly")
#   ROOMLY_KEYSTORE_BASE64   - base64 of android/app/roomly-release.keystore
#                              (leave EMPTY on the very first run: the workflow
#                               generates a keystore and uploads it as an artifact
#                               so you can save it, base64 it, and add it here)
# Optional repo variable (Settings -> Variables):
#   VITE_API_URL - your hosted backend (required for the native app to reach the API)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      ROOMLY_KEYSTORE_BASE64: ${{ secrets.ROOMLY_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor (copy web build into Android)
        run: npx cap sync android

      # Monotonic version numbers: YYMMDDHH always increases, so versionCode never
      # collides across builds and Play Store accepts the bump.
      - name: Compute version code
        run: |
          echo "ROOMLY_VERSION_CODE=$(date +%y%m%d%H)" >> $GITHUB_ENV
          echo "ROOMLY_VERSION_NAME=1.0.$(date +%y%m%d%H)" >> $GITHUB_ENV

      # Restore the release keystore from secret, if provided.
      - name: Decode release keystore (from secret)
        if: env.ROOMLY_KEYSTORE_BASE64 != ''
        env:
          ROOMLY_KEYSTORE_BASE64: ${{ secrets.ROOMLY_KEYSTORE_BASE64 }}
        run: |
          echo "$ROOMLY_KEYSTORE_BASE64" | base64 -d > android/app/roomly-release.keystore

      # On the very first run there is no keystore yet: generate one and keep it
      # as an artifact so you can save + base64 it forever (Google Play needs the
      # SAME key for every update).
      - name: Generate release keystore (first run)
        if: env.ROOMLY_KEYSTORE_BASE64 == ''
        env:
          ROOMLY_KEYSTORE_PASSWORD: ${{ secrets.ROOMLY_KEYSTORE_PASSWORD }}
          ROOMLY_KEY_PASSWORD: ${{ secrets.ROOMLY_KEY_PASSWORD }}
          ROOMLY_KEY_ALIAS: ${{ secrets.ROOMLY_KEY_ALIAS }}
        run: |
          keytool -genkeypair -v \
            -keystore android/app/roomly-release.keystore \
            -alias "$ROOMLY_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$ROOMLY_KEYSTORE_PASSWORD" \
            -keypass "$ROOMLY_KEY_PASSWORD" \
            -dname "CN=Roomly, OU=Roomly, O=Roomly, L=Internet, ST=Internet, C=US"

      - name: Build signed release APK
        env:
          ROOMLY_KEYSTORE_PASSWORD: ${{ secrets.ROOMLY_KEYSTORE_PASSWORD }}
          ROOMLY_KEY_PASSWORD: ${{ secrets.ROOMLY_KEY_PASSWORD }}
          ROOMLY_KEY_ALIAS: ${{ secrets.ROOMLY_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -ProomlyVersionCode=$ROOMLY_VERSION_CODE \
            -ProomlyVersionName=$ROOMLY_VERSION_NAME

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roomly-apk
          path: client/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Only produced on a first-run (fresh) keystore generation — SAVE THIS.
      - name: Upload generated keystore (first run only)
        if: env.ROOMLY_KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: roomly-release-keystore
          path: client/android/app/roomly-release.keystore
